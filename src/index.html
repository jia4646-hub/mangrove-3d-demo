<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mangrove</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="loader" class="loader" aria-hidden="true"></div>
      <div class="toolbar" aria-label="controls">
        <button
          id="pan-toggle"
          class="tool-btn"
          type="button"
          aria-pressed="false"
          title="平移模式"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <!-- 上 -->
            <path d="M12 3.2v4.2" />
            <path d="M9.6 5.4L12 3.2l2.4 2.2" />
            <!-- 下 -->
            <path d="M12 16.6v4.2" />
            <path d="M9.6 18.6L12 20.8l2.4-2.2" />
            <!-- 左 -->
            <path d="M7.4 12H3.2" />
            <path d="M5.4 9.6L3.2 12l2.2 2.4" />
            <!-- 右 -->
            <path d="M16.6 12h4.2" />
            <path d="M18.6 9.6L20.8 12l-2.2 2.4" />
          </svg>
        </button>
        <a id="leaf-link" class="tool-btn" href="./leaf.html" title="叶子呼吸">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 21s-7-4.4-7-10.2C5 6.5 8 4 12 3c4 1 7 3.5 7 7.8C19 16.6 12 21 12 21z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <path
              d="M12 20.2V8.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              class="leaf-breath-wave"
              d="M9.2 11.2c1.4-.8 2.8-.8 4.2 0M8.6 14c1.8-1 3.6-1 5.4 0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
        </a>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
